<!doctype html>

<body>
<div id="app"></div>
<script>
window.DIR = {

  lead: '깨끗한 회색 건물에 대표의 붉은 도장 하나. 화면은 조용한 무채색, 색은 마스코트와 "대표 몫(결정 · 확인)"에만 쓴다. 대담한 3D 마스코트가 주인공이 되는 무대.',
  words: ['대담한', '명료한', '믿음직한', '자라는'],
  fonts: '제목 · 본문 · 숫자 모두 Pretendard(제목 800, 숫자 고정폭)',
  iconRule: '2px 선, 둥근 끝, 지금 위치는 연한 채움',
  colorRule: '<b>검정 = 행동</b>(주 버튼), <b>인주색 = 대표 몫</b>(결정 · 확인 · 결정함 배지 · 3D 결재함), <b>황동 = 성장</b>(자원 · 레벨). 나머지는 무채색. 이모지 아이콘은 쓰지 않는다.',

  dark: '그래파이트 바탕. 밤엔 창이 호박빛으로 켜지고 결재함의 인주색이 가장 밝은 점이 된다 — "확인할 게 있다"가 어두운 화면에서도 한눈에.',

  cons: ['지금 결(종이 · 초록 · 명조)에서 가장 많이 바뀐다 — 토큰 · 컴포넌트 · 3D 재질을 모두 손봐야 한다.', '붉은 계열이 "문제"로 읽힐 수 있다 — 문제 색은 라즈베리 + 경고 아이콘 + 낱말로 따로 둬야 한다.', '무채색이 차갑게 느껴질 수 있다 — 말투(해요체)와 마스코트로 따뜻함을 채워야 한다.'],
