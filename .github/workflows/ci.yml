# 타입 검사 · 테스트 · 문법 확인 — 외부 호출 없음(가짜 AI · 드라이런)
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Syntax-check browser scripts and the CLI
        run: |
          for f in $(git ls-files 'web/js/*.js' 'web/js/**/*.js' 'bin/*.mjs'); do node --check "$f"; done
          bash -n scripts/install.sh
      - name: CLI smoke test
        run: |
          node bin/agent-office.mjs version
          node bin/agent-office.mjs doctor --data "$RUNNER_TEMP/ao" --port 4399
